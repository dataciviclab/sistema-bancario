root: "../../out"
schema_version: 1

dataset:
  name: "banche_unified"
  source_id: "dataciviclab_composite"
  tags: [banche, compose, unified, panorama]
  category: economia
  description: "Compose: vista unificata KPI bancari + bilanci + tassi da ecb-cbd2 + ecb-bsi + ecb-mir."
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "cbd2_kpi"
      type: local_file
      args:
        path: "../../out/data/mart/ecb_cbd2/{year}/mart_bank_kpi.parquet"
        filename: "cbd2_kpi.parquet"
      primary: true

support:
  - type: dataset
    name: bsi_balance
    config: ../../datasets/ecb-bsi/dataset.yml
    years: [2026]
  - type: dataset
    name: mir_rates
    config: ../../datasets/ecb-mir/dataset.yml
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_panorama"
      sql: "sql/mart_panorama.sql"
  required_tables:
    - mart_panorama
  validate:
    table_rules:
      mart_panorama:
        not_null: [paese, anno, trimestre]
        min_rows: 50

validation:
  fail_on_error: true
