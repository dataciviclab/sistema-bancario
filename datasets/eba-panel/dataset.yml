root: "../../out"
schema_version: 1

dataset:
  name: "eba_panel"
  source_id: "eba"
  tags: [banche, eba, panel, banche-singole, corep, finrep]
  category: economia
  years: [2025]
  time_coverage:
    start_year: 2012
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eba_panel_raw"
      type: "http_file"
      client:
        timeout: 300
        retries: 2
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      args:
        url: "https://github.com/ericc001/european-bank-regulatory-data/raw/main/dataset.parquet"
        filename: "raw_input.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - banca
    - paese
    - periodo
    - codice_variabile
    - nome_variabile
    - valore
  validate:
    min_rows: 10000

mart:
  tables:
    - name: "mart_banche_kpi"
      sql: "sql/mart_banche_kpi.sql"
    - name: "mart_banche_snapshot"
      sql: "sql/mart_banche_snapshot.sql"
  required_tables: ["mart_banche_kpi", "mart_banche_snapshot"]
  validate:
    table_rules:
      mart_banche_kpi:
        not_null: [banca, periodo]
        min_rows: 1000
      mart_banche_snapshot:
        not_null: [banca]
        min_rows: 50
