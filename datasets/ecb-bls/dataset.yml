root: "../../out"
schema_version: 1

dataset:
  name: "ecb_bls"
  source_id: "ecb"
  tags: [banche, bce, bls, credit-standards, domanda-credito]
  category: economia
  years: [2026]
  time_coverage:
    start_year: 2007
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "ecb_bls_raw"
      type: "http_file"
      client:
        timeout: 120
        retries: 2
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      args:
        url: "https://data-api.ecb.europa.eu/service/data/BLS?format=csvdata"
        filename: "ecb_bls_raw.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
    - paese
    - voce
    - periodo
    - valore
    - anno
    - trimestre
  validate:
    min_rows: 1000

mart:
  tables:
    - name: "mart_bls_credit"
      sql: "sql/mart_bls_credit.sql"
    - name: "mart_bls_snapshot"
      sql: "sql/mart_bls_snapshot.sql"
  required_tables: ["mart_bls_credit", "mart_bls_snapshot"]
  validate:
    table_rules:
      mart_bls_credit:
        not_null: [paese, anno]
        min_rows: 100
      mart_bls_snapshot:
        not_null: [paese]
        min_rows: 10
