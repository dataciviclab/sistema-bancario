root: "../../out"
schema_version: 1

dataset:
  name: "wb_financial"
  source_id: "worldbank"
  tags: [banche, world-bank, wdi, npl, credito, filiali, storico]
  category: economia
  years: [2026]
  time_coverage:
    start_year: 1960
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "wb_financial_raw"
      type: "script"
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
    - paese
    - codice_paese
    - indicatore
    - codice_indicatore
    - anno
    - valore
  validate:
    min_rows: 1000

mart:
  tables:
    - name: "mart_wd_indicators"
      sql: "sql/mart_wd_indicators.sql"
    - name: "mart_wd_snapshot"
      sql: "sql/mart_wd_snapshot.sql"
  required_tables: ["mart_wd_indicators", "mart_wd_snapshot"]
  validate:
    table_rules:
      mart_wd_indicators:
        not_null: [paese, anno]
        min_rows: 100
      mart_wd_snapshot:
        not_null: [paese]
        min_rows: 10
