[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-sistema-bancario"
version = "0.1.0"
description = "Sistema bancario italiano — dati banche e intermediari"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
# Catalog engine per-repo (probe, inventory, source report).
observatory = [
    "dataciviclab-source-observatory @ git+https://github.com/dataciviclab/source-observatory.git@main",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/sistema-bancario"

[tool.toolkit.extends]
source_id = "sistema-bancario"

[tool.observatory]
source_id = "ecb"
protocol = "sdmx"
base_url = "https://data-api.ecb.europa.eu/service/dataflow/all/all/latest"
observation_mode = "catalog-watch"
verdict = "go"
note = "Catalogo SDMX ECB (data-api.ecb.europa.eu). Il repo consuma 4 dataflow via http_file (BLS, BSI, CBD2, MIR) con format=csvdata. Attenzione: toolkit.extends dichiara 'sistema-bancario', i dataset.yml usano 'ecb'."
